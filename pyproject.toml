
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-intelligence-lab"
version = "0.1.0"
description = "Independent Formula 1 Data Science and Machine Learning platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [requests]

[tool.setuptools.packages.find]
where = ["src"]
